name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 获取项目代码
        uses: actions/checkout@v6

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: python -m pip install -r requirements.txt

      - name: 运行测试
        run: python -m unittest discover -s tests -v

  frontend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 获取项目代码
        uses: actions/checkout@v6

      - name: 准备 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: 安装前端依赖
        working-directory: frontend
        run: npm ci

      - name: 构建前端
        working-directory: frontend
        run: npm run build
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 获取项目代码
        uses: actions/checkout@v6

      - name: 构建 Docker 镜像
        run: docker build --progress=plain -t agent-learning:ci .

      - name: 启动容器
        run: |
          docker run -d \
            --name research-ci \
            -p 127.0.0.1:8001:8000 \
            agent-learning:ci

      - name: 等待服务并检查健康接口
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent --show-error --max-time 2 \
              http://127.0.0.1:8001/api/health; then
              echo
              echo "健康检查通过"
              exit 0
            fi
            sleep 2
          done
          echo "服务未能在等待时间内就绪"
          exit 1

      - name: 查看容器日志
        if: always()
        run: docker logs research-ci

      - name: 清理容器
        if: always()
        run: docker rm -f research-ci